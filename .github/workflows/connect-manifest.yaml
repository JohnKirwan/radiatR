# Regenerate inst/app/manifest.json for Posit Connect Cloud.
#
# Connect Cloud is git-backed: it pulls this repo and rebuilds the app in
# inst/app on every push, resolving R package dependencies from the committed
# manifest.json (there is no deploy step). The app tracks the
# development version, not the CRAN release, so the manifest must record radiatR
# with its GitHub remote -- which requires radiatR
# to be *installed from GitHub* when the manifest is written. This workflow does
# that in a clean environment and pushes the regenerated manifest to the
# chore/connect-manifest branch. It does not open the PR: a PR opened by
# github-actions[bot] makes a squash-merge author the commit as the bot, which
# adds it to the repo's contributors. Open it yourself with the `gh pr create`
# command printed in the run summary.
#
# Run it (Actions -> "connect-manifest" -> Run workflow) whenever the app's
# dependencies or the pinned R version change. Open and merge the PR; Connect Cloud
# redeploys from the updated manifest on the next push to the tracked branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "radiatR git ref to install & record in the manifest"
        default: main
        required: false

name: connect-manifest

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          # Install from CRAN source, not Posit Package Manager binaries. pak
          # skips LinkingTo-only packages (cpp11, progress) when it installs
          # binaries, and writeManifest then aborts because renv counts them
          # as required. Source installs also record a plain CRAN URL in the
          # manifest instead of a binary URL tied to one Linux distribution.
          use-public-rspm: false
          # The manifest records this R version for the Connect Cloud build.
          # Pin one minor behind the newest release (the version the package is
          # already CI-tested on) for a Connect-Cloud-supported runtime.
          r-version: 'oldrel-1'

      # App runtime deps. radiatR is installed FROM GitHub so writeManifest
      # captures its RemoteType/RemoteRef metadata; the rest are app-only.
      # The app's own packages are plain refs, not `any::`: pak records an
      # `any::` install as RemoteType "any", which writeManifest turns into
      # Source "any" with the repository *name* "CRAN" instead of its URL, and
      # Connect Cloud cannot download from that.
      - name: Install app dependencies (radiatR from GitHub)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Bumped to discard the cached library, whose shiny and svglite still
          # carry the `any::` metadata: an installed package is not reinstalled.
          cache-version: 2
          packages: |
            any::rsconnect
            shiny
            bslib
            svglite
            github::JohnKirwan/radiatR@${{ github.event.inputs.ref || 'main' }}

      - name: Write manifest
        shell: Rscript {0}
        run: |
          rsconnect::writeManifest(appDir = "inst/app")

      # Connect Cloud downloads each package from the manifest's Repository URL
      # (or from GitHub), so a package with neither cannot be installed.
      - name: Check every package is downloadable
        shell: Rscript {0}
        run: |
          pkgs <- jsonlite::fromJSON("inst/app/manifest.json", simplifyVector = FALSE)$packages
          ok <- vapply(pkgs, function(p) {
            identical(p$Source, "github") ||
              (is.character(p$Repository) && grepl("^https?://", p$Repository))
          }, logical(1))
          if (!all(ok)) {
            bad <- vapply(pkgs[!ok], function(p) {
              sprintf("Source = %s, Repository = %s", format(p$Source), format(p$Repository))
            }, character(1))
            stop("manifest.json packages with no repository URL:\n",
                 paste0("  ", names(bad), ": ", bad, collapse = "\n"), call. = FALSE)
          }

      - name: Push regenerated manifest
        env:
          RADIATR_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          git config user.name JohnKirwan
          git config user.email 3696221+JohnKirwan@users.noreply.github.com
          git add inst/app/manifest.json
          if git diff --cached --quiet; then
            echo "::notice::inst/app/manifest.json is unchanged; nothing to push"
            exit 0
          fi
          git commit -m "chore: regenerate inst/app/manifest.json"
          # chore/connect-manifest belongs to this workflow; each run replaces it.
          git push --force origin HEAD:refs/heads/chore/connect-manifest
          {
            echo "Pushed \`chore/connect-manifest\`. Open the PR as yourself:"
            echo
            echo '```sh'
            echo "gh pr create --base main --head chore/connect-manifest \\"
            echo "  --title 'chore: regenerate Connect Cloud manifest' \\"
            echo "  --body 'Regenerated inst/app/manifest.json via the connect-manifest workflow (radiatR ref: $RADIATR_REF).'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
