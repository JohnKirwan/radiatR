# R CMD check via r-lib/actions, on Ubuntu/Windows/macOS. On Ubuntu,
# GitHub-hosted runners ship a headless Google Chrome, so the shinytest2
# browser tests (tests/testthat/test-app-example.R) run rather than skip.
# NOT_CRAN is set so their skip_on_cran() guards do not short-circuit them;
# on Windows/macOS (no preinstalled Chrome) those tests still skip cleanly
# via their own skip_if(is.null(chromote::find_chrome())) guard.
#
# Two rows mirror CRAN's own checks. The R-devel row is CRAN's devel flavour.
# The `cran: true` row is a CRAN-mode check with only the hard dependencies
# (plus testthat, knitr and rmarkdown, which run the tests and vignettes): it
# leaves NOT_CRAN and R_KEEP_PKG_SOURCE unset, so skip_on_cran() applies and
# its "installed size is" line is the size CRAN will see (kept sources add
# about 0.5 MB to R/). It runs on macOS, the platform with the largest install.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.cran && ' CRAN mode, no Suggests' || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: macos-latest, r: 'release', cran: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: ${{ matrix.config.cran && 'no' || 'yes' }}
      # Run tests guarded by skip_on_cran(), including the shinytest2 browser
      # walk-through. The Ubuntu runner's preinstalled Chrome is detected by
      # chromote; setup-shinytest2.R supplies the sandbox-safe launch flags.
      NOT_CRAN: ${{ matrix.config.cran && 'false' || 'true' }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.cran && '"hard"' || '"all"' }}
          extra-packages: >-
            any::rcmdcheck
            ${{ matrix.config.cran && 'any::testthat any::knitr any::rmarkdown' || '' }}
          needs: check
          # A cache of its own: the shared key's restore-keys would otherwise
          # restore the macOS release row's library, Suggests and all.
          cache-version: ${{ matrix.config.cran && 'no-suggests-1' || '1' }}

      # Fail if the no-Suggests row has any Suggests beyond the test and
      # vignette tooling (and their own dependencies, e.g. withr, yaml).
      - name: Check that Suggests are absent
        if: matrix.config.cran
        shell: Rscript {0}
        run: |
          sugg <- trimws(sub("\\(.*", "", strsplit(read.dcf("DESCRIPTION", "Suggests"), ",")[[1]]))
          tooling <- c("testthat", "knitr", "rmarkdown")
          keep <- unique(c(tooling, unlist(tools::package_dependencies(
            tooling, db = installed.packages(), recursive = TRUE))))
          present <- setdiff(sugg[vapply(sugg, requireNamespace, logical(1), quietly = TRUE)], keep)
          if (length(present)) stop("Suggests installed: ", toString(present))
          cat("Not installed:", toString(setdiff(sugg, keep)), "\n")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # CRAN's limit is 5 MB; fail early with headroom. check-r-package leaves
      # the tarball it built in check/.
      - name: Check source tarball size
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        shell: bash
        run: |
          tarball=$(ls check/*.tar.gz)
          size=$(stat -c %s "$tarball")
          echo "$tarball: $size bytes (limit 4500000)"
          tar tzvf "$tarball" | sort -k3 -rn | sed -n '1,15p'
          test "$size" -le 4500000
